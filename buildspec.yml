version: 0.2

phases:
  install:
    runtime-versions:
      java: corretto25
  pre_build:
    commands:
      - echo Initializing environment
      - export CODEARTIFACT_AUTH_TOKEN=$(aws codeartifact get-authorization-token --domain nextwork --domain-owner 147997152300 --region us-east-2 --query authorizationToken --output text)
      - test -n "$CODEARTIFACT_AUTH_TOKEN"

  build:
    commands:
      - echo Build started on `date`
      - mvn -s settings.xml compile
  post_build:
    commands:
      - echo Build completed on `date`
      - mvn -s settings.xml package
artifacts:
  files:
    - target/nextwork-web-project.war
  discard-paths: no
